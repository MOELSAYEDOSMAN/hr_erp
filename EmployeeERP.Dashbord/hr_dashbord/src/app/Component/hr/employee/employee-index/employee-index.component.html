<div class="card shadow">
  <div class="card-header d-flex justify-content-between align-items-center">
      <h5 class="mb-0">Employee List</h5>
      <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#employeeModal">
          Add Employee
      </button>
  </div>

  <div class="card-body">
      <div class="row mb-3">
          <div class="col-md-4">
              <input (input)="filter($event)" type="text" class="form-control" id="searchInput" placeholder="Search employees...">
          </div>
      </div>

      <div class="table-responsive">
          <table class="table table-hover">
              <thead class="table-light">
                  <tr>
                      <th class="sortable" data-sort="id">ID</th>
                      <th class="sortable" data-sort="fname">First Name</th>
                      <th class="sortable" data-sort="lname">Last Name</th>
                      <th class="sortable" data-sort="email">Email</th>
                      <th class="sortable" data-sort="position">Position</th>
                      <th class="sortable" data-sort="creation">Created</th>
                      <th class="sortable" data-sort="creation"></th>

                  </tr>
              </thead>
              <tbody id="employeeTableBody">
                <tr *ngFor="let emp of data.data">
                  <td>{{emp.id}}</td>
                  <td>{{emp.firstName}}</td>
                  <td>{{emp.lastName}}</td>
                  <td>{{emp.email}}</td>
                  <td><span class="badge w-100 bg-info">{{emp.position}}</span></td>
                  <td>{{emp.creation| date: 'dd-MMM-yyyy HH:mm'}}</td>
                  <td>
                      <button class="btn btn-sm btn-outline-primary me-1" onclick="editEmployee(1)">
                          ✏️
                      </button>
                      <button class="btn btn-sm btn-outline-danger" onclick="deleteEmployee(1)">
                          🗑️
                      </button>
                  </td>
              </tr>
              </tbody>
          </table>
      </div>

      <nav aria-label="Page navigation">
          <ul class="pagination justify-content-end">
              <li class="page-item" [class.d-none]="page<=1" (click)="prevpage()" id="prevPage"><a class="page-link" href="#">Previous</a></li>
              <li class="page-item disabled"><span class="page-link" id="currentPage">{{page}}</span></li>
              <li class="page-item" [class.d-none]="page>=data.pages"  (click)="nextpage()"  id="nextPage" ><a class="page-link" href="#">Next</a></li>
          </ul>
      </nav>
  </div>
</div>

<!-- Employee Modal -->
<div class="modal fade" id="employeeModal">
  <div class="modal-dialog modal-dialog-centered">
     <app-employee-model-insert (callApiEvent)="loadEmployeeData()" class="w-100"></app-employee-model-insert>
  </div>
</div>
