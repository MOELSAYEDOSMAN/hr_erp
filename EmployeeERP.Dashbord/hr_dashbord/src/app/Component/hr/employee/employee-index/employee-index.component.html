<div class="card shadow">
  <div class="card-header d-flex justify-content-between align-items-center">
      <h5 class="mb-0">Employee List</h5>
      <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#employeeModal">
          Add Employee
      </button>
  </div>

  <div class="card-body">


      <div class="table-responsive">
          <table class="table table-hover">
              <thead class="table-light">
                  <tr>
                      <th class="sortable" data-sort="id">ID</th>
                      <th class="sortable" data-sort="fname">First Name</th>
                      <th class="sortable" data-sort="lname">Last Name</th>
                      <th class="sortable" data-sort="email">Email</th>
                      <th class="sortable" data-sort="position">Position</th>
                      <th class="sortable" data-sort="creation">Created</th>
                      <th class="sortable" data-sort="creation"></th>

                  </tr>
              </thead>
              <tbody id="employeeTableBody">

                <tr>
                  <th><input type="number" min="0" [(ngModel)]="emp.id" class="form-control" onkeyup="filterTable(0, this.value)" placeholder="Filter ID"></th>
                  <th><input type="text"  [(ngModel)]="emp.firstName" class="form-control" onkeyup="filterTable(1, this.value)" placeholder="Filter First Name"></th>
                  <th><input type="text"  [(ngModel)]="emp.lastName" class="form-control" onkeyup="filterTable(2, this.value)" placeholder="Filter Last Name"></th>
                  <th><input type="text"  [(ngModel)]="emp.email" class="form-control" onkeyup="filterTable(3, this.value)" placeholder="Filter Email"></th>
                  <th><input type="text"  [(ngModel)]="emp.position" class="form-control" onkeyup="filterTable(4, this.value)" placeholder="Filter Position"></th>
                  <th><input type="date"  [(ngModel)]="emp.creation" class="form-control" onkeyup="filterTable(5, this.value)" placeholder="Filter Created"></th>
                  <th><button class="btn btn-secondary" (click)="filter()">filter</button></th>
                </tr>


                <tr *ngFor="let emp of data.data">
                  <td>{{emp.id}}</td>
                  <td>{{emp.firstName}}</td>
                  <td>{{emp.lastName}}</td>
                  <td>{{emp.email}}</td>
                  <td><span class="badge w-100 bg-info">{{emp.position}}</span></td>
                  <td>{{emp.creation| date: 'dd-MMM-yyyy HH:mm'}}</td>
                  <td>
                      <a class="btn btn-sm btn-outline-primary me-1" href="EmployeeDetails/{{emp.id}}" >
                          ✏️
                      </a>
                      <button class="btn btn-sm btn-outline-danger" data-bs-toggle="modal" data-bs-target="#employeeDelted" (click)="setid(emp.id)">
                          🗑️
                      </button>
                  </td>
              </tr>
              </tbody>
          </table>
      </div>

      <nav aria-label="Page navigation">
          <ul class="pagination justify-content-end">
              <li class="page-item" [class.d-none]="page<=1" (click)="prevpage()" id="prevPage"><button class="page-link" >Previous</button></li>
              <li class="page-item disabled"><span class="page-link" id="currentPage">{{page}}</span></li>
              <li class="page-item" [class.d-none]="page>=data.pages"  (click)="nextpage()"  id="nextPage" ><button class="page-link" >Next</button></li>
          </ul>
      </nav>
  </div>
</div>

<!-- Employee Modal -->
<div class="modal fade" id="employeeModal">
  <div class="modal-dialog modal-dialog-centered">
     <app-employee-model-insert (callApiEvent)="loadEmployeeData()" [employee_update]="null" class="w-100"></app-employee-model-insert>
  </div>
</div>



<div class="modal fade" id="employeeDelted">
  <div class="modal-dialog modal-dialog-centered">
     <app-employee-removed  (callApiEvent)="loadEmployeeData()" [employeeId]="empid" class="w-100"></app-employee-removed>
  </div>
</div>
