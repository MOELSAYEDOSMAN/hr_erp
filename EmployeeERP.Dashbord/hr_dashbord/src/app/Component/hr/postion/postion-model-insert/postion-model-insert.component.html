<div class="modal-content w-100">
  <div class="modal-header">
      <h5 class="modal-title">Add New Postion</h5>
      <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
  </div>
  <form id="employeeForm" [formGroup]="formInput" (submit)="sumbit()">
      <div class="modal-body">
          <div class="mb-3">
              <label class="form-label">Title</label>
              <input formControlName="title" [class.is-valid]="title?.valid" [class.is-invalid]="!title?.valid&&!title?.untouched" type="text" class="form-control" name="title" required>
              <div [hidden]="title?.untouched||title?.valid" class="alert alert-danger text-center m-1">
                <small id="emailHelp" class="form-text text-muted ">{{title?.errors?.['required']?"Must Enter Value":""}}</small>
                <small id="emailHelp" class="form-text text-muted ">{{title?.errors?.['minLength']?"Must Enter Value":""}}</small>

              </div>
          </div>
      </div>

      <div class="alert alert-danger" *ngIf="message!=null&&message.length!=0"  role="alert">
        {{message}}
      </div>
      <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
          <button type="submit" class="btn btn-primary">Save Postion</button>
      </div>
  </form>
</div>
